# Proposed future configuration only; no Render service, public URL, or deployment exists.
services:
  - type: web
    name: wayfinder-grid-snake
    rootDir: .
    env: node
    plan: free
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        sync: false
